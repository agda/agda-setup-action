name: Test Action

on:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
        include:
          - os: ubuntu-latest
            agda-stdlib-version: '2.3'
          - os: windows-latest
            agda-stdlib-version: ''
          - os: macos-latest
            agda-stdlib-version: '2.3'
          - os: macos-13
            agda-stdlib-version: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Agda
        id: setup
        uses: ./
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: ${{ matrix.agda-stdlib-version }}

      - name: Verify Agda installation
        run: |
          echo "Agda path: ${{ steps.setup.outputs.agda-path }}"
          echo "Agda dir: ${{ steps.setup.outputs.agda-dir }}"
          agda --version
          
      - name: Create test file
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat > test.agda << 'EOF'
          module test where
          
          data Bool : Set where
            true false : Bool
          EOF

      - name: Test Agda
        if: matrix.os == 'ubuntu-latest'
        run: agda test.agda
